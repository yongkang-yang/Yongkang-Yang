baseURL = 'https://yongkang-yang.github.io/Yongkang-Yang/'
languageCode = 'en'
title = 'Yongkang Yang'
theme = 'PaperMod'
enableRobotsTXT = true
summaryLength = 120

[pagination]
  pagerSize = 10

[services.googleAnalytics]
  ID = 'G-YC066ZFZ27'

[params]
  author = 'Yongkang Yang'
  description = "Yongkang Yang is a PhD candidate in Organizational Behavior at Rotterdam School of Management, Erasmus University Rotterdam. Notes on research, methods, and tools."
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true

  [params.homeInfoParams]
    Title = "Yongkang Yang"
    Content = """PhD candidate in Organizational Behavior at [Rotterdam School of Management](https://www.rsm.nl/), Erasmus University Rotterdam. \
I study team membership change, multicultural teams, team diversity, and how AI shapes people and organizations. \
This site collects my notes on research, methods, and tools. See [About](about/), [Research](research/), and [Teaching](teaching/)."""

